<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>BC Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>BC Tracker</h1>
      <input id="search" type="search" placeholder="Search tasks or projects" autocomplete="off" />
      <label class="toggle" title="Show each task once per day">
        <input id="unique" type="checkbox" checked />
        <span class="toggle__track"></span>
        Unique/day
      </label>
      <kbd id="hotkey"></kbd>
      <button id="open-settings" class="icon-button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19.14 12.94a7.5 7.5 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
    </header>

    <section id="status" class="status">
      <button id="status-stop" class="round round--stop" title="Stop timer" hidden>■</button>
      <span id="status-text" class="status__text">Loading…</span>
      <button id="status-bulk" class="picker-trigger status__bulk" hidden>
        <span class="picker-trigger__text"></span>
      </button>
      <span id="status-clock" class="status__clock"></span>
      <button id="reassign" class="status__reassign" title="Move entries to another task" aria-pressed="false" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h10M9 2l3 3-3 3M14 11H4M7 8l-3 3 3 3" /></svg>
        Reassign
      </button>
    </section>
    <p id="notice" class="notice" hidden></p>

    <main id="list" class="list"></main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <div class="settings__panel">
        <header class="settings__header">
          <h2 id="settings-title">Settings</h2>
          <button id="close-settings" class="icon-button" title="Close" aria-label="Close">✕</button>
        </header>

        <div class="setting">
          <div class="setting__text">
            <label for="setting-autostart">Start with Windows</label>
            <p>Opens in the tray when you log in, so the Basecamp button stays live.</p>
            <p id="autostart-hint" hidden>Only available in the built app, not in dev.</p>
          </div>
          <label class="toggle">
            <input id="setting-autostart" type="checkbox" />
            <span class="toggle__track"></span>
          </label>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span id="hotkey-label">Global shortcut</span>
            <p>Stops the timer, or resumes your last task. Click to change.</p>
          </div>
          <button id="setting-hotkey" class="hotkey-button" aria-labelledby="hotkey-label"></button>
        </div>

        <div class="setting setting--stacked">
          <div class="setting__text">
            <label for="setting-timezone">Time zone</label>
            <p>Only decides which day entries are grouped under.</p>
          </div>
          <select id="setting-timezone"></select>
        </div>

        <p id="settings-message" class="settings__message" hidden></p>
      </div>
    </dialog>

    <dialog id="confirm" class="settings confirm" aria-labelledby="confirm-title">
      <form method="dialog" class="settings__panel">
        <h2 id="confirm-title" class="confirm__title">Delete entries?</h2>
        <p id="confirm-text" class="confirm__text"></p>
        <div class="confirm__actions">
          <button class="confirm__button" value="cancel" autofocus>Cancel</button>
          <button class="confirm__button confirm__button--danger" value="confirm">Delete all</button>
        </div>
      </form>
    </dialog>

    <template id="entry-template">
      <article class="entry">
        <input type="checkbox" class="entry__check" aria-label="Select all entries of this task" />
        <button class="round entry__toggle"></button>
        <div class="entry__body" title="Copy task link">
          <div class="entry__title"></div>
          <div class="entry__meta"></div>
        </div>
        <button class="entry__delete" title="Delete entry">✕</button>
        <button class="entry__expand" aria-label="Toggle entries">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
        </button>
      </article>
    </template>

    <template id="child-template">
      <article class="entry entry--child">
        <input type="checkbox" class="entry__check" aria-label="Select entry" />
        <div class="entry__body" title="Copy task link">
          <div class="entry__meta"></div>
        </div>
        <button class="entry__delete" title="Delete entry">✕</button>
      </article>
    </template>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
